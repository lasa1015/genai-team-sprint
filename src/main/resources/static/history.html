<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FX App — Transfer history</title>
  <link rel="stylesheet" href="/css/app.css">
</head>

<body>
  <header class="topbar">
    <span class="brand"><span class="fx">FX</span> App</span>
    <nav class="menu">
      <a href="/">Welcome</a>
      <a href="/currencies.html">Currencies</a>
      <a href="/#latest-rates">Rates</a>
      <a href="/convert">Convert</a>
      <a href="/history" class="active">History</a>
      <a href="/about.html">About</a>
    </nav>
  </header>

  <main>
    <h1>Transfer history</h1>
    <p class="lede">
      Every recorded conversion appears here. The newest transfers are shown first.
    </p>

    <div class="panel">
      <h2>Recorded transfers</h2>
      <table>
        <thead>
          <tr>
            <th>From</th>
            <th>To</th>
            <th>Amount</th>
            <th>Currency</th>
            <th>Executed at</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="history-rows">
          <tr>
            <td colspan="6" class="status">Loading…</td>
          </tr>
        </tbody>
      </table>
      <p id="history-status" class="status"></p>
    </div>
  </main>

  <script src="/js/history.js"></script>
</body>

</html>
